<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>BUTT FISHING</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            background-color: #1a1a1a;
            color: #d3d3d3;
            font-family: 'Press Start 2P', cursive;
            margin: 0;
            overflow: hidden;
            font-size: 10px;
        }

        #main-wrapper {
            display: flex;
            width: 100vw;
            height: 100vh;
            transition: transform 0.3s ease;
            transform: translateX(0);
        }
        .shifted { transform: translateX(220px) !important; }

        #shop-panel {
            width: 220px;
            background: #111;
            border-right: 4px solid #333;
            padding: 20px;
            box-sizing: border-box;
            position: absolute;
            left: -220px;
            height: 100vh;
        }
        .shop-item {
            background: #222;
            border: 2px solid #444;
            padding: 10px;
            margin-bottom: 10px;
            text-align: center;
            border-radius: 5px;
        }

        #shop-toggle {
            position: absolute; left: 10px; top: 10px; z-index: 100;
            background: #ff9800; border: none; padding: 10px;
            cursor: pointer; font-family: inherit; border-radius: 5px;
        }
        #admin-toggle {
            position: absolute; right: 10px; top: 10px; z-index: 100;
            background: #d32f2f; color: white; border: none; padding: 10px;
            cursor: pointer; font-family: inherit; border-radius: 5px; display: none;
        }

        #game-container {
            display: flex; justify-content: center; align-items: center;
            width: 100vw; gap: 20px;
        }
        .panel {
            background: #111; border: 2px solid #444; border-radius: 8px;
            padding: 15px; display: flex; flex-direction: column; gap: 15px;
        }
        .center-panel { width: 500px; text-align: center; }

        button {
            color: white; border: 2px solid #1a3a16; padding: 10px;
            cursor: pointer; font-family: 'Press Start 2P', cursive;
            font-size: 10px; border-radius: 5px; background: #2d5a27;
        }
        button:disabled { background: #555 !important; border-color: #333 !important; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #3e7a36; }

        input, select {
            background: #000; border: 1px solid #555; color: #fff;
            padding: 8px; font-family: inherit; font-size: 10px; text-align: center;
            margin-bottom: 10px; width: 80%; border-radius: 4px;
        }

        /* Визуальная зона рыбалки */
        #fishing-area {
            position: relative; background: linear-gradient(#1c2a38, #0f161c);
            border: 2px solid #444; height: 260px; margin-bottom: 15px;
            overflow: hidden; border-radius: 6px;
        }
        .water {
            position: absolute; bottom: 0; width: 100%; height: 55%;
            background: linear-gradient(180deg, #183545 0%, #0c1a24 100%);
            border-top: 2px solid #234d65;
        }
        .dock {
            position: absolute; bottom: 0; left: 0; width: 130px; height: 60%;
            background: #4e342e; border-right: 4px solid #261714; border-top: 4px solid #6d4c41;
        }
        .float {
            position: absolute; width: 8px; height: 14px; background: #f44336;
            border-radius: 5px; border: 1px solid #fff; bottom: 35%; left: 180px;
            display: none; animation: bobbing 0.8s infinite alternate ease-in-out;
        }
        @keyframes bobbing { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }

        /* Игрок с удочкой */
        #player-character { position: absolute; bottom: 42%; left: 45px; width: 50px; height: 60px; z-index: 3; }
        #player-character .head { width: 22px; height: 22px; background: #ffcc99; position: absolute; top: 0; left: 10px; border-radius: 4px; }
        #player-character .body { width: 28px; height: 34px; background: #37474f; position: absolute; top: 22px; left: 7px; border-radius: 5px; }
        #player-character .rod { width: 110px; height: 2px; background: #d7ccc8; position: absolute; top: 28px; left: 18px; transform: rotate(-25deg); transform-origin: left center; }

        /* Зона подсечки (кликер) */
        #minigame-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; background: rgba(0,0,0,0.65); z-index: 10; }
        .target-circle { position: absolute; background: #4caf50; border: 3px solid #fff; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px #4caf50; }

        .fish-card { background: #181818; border: 1px solid #333; padding: 8px; margin-bottom: 5px; border-radius: 4px; }
        #inventory-list { max-height: 280px; overflow-y: auto; }

        #admin-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; }
        .admin-box { background: #111; border: 3px solid #d32f2f; padding: 20px; width: 600px; max-height: 80vh; overflow-y: auto; border-radius: 8px; }
        .admin-row { display: flex; justify-content: space-between; align-items: center; background: #222; border: 1px solid #444; padding: 10px; margin-bottom: 10px; font-size: 8px; }
        .admin-input { width: 60px !important; margin: 0 5px !important; padding: 4px !important; font-size: 8px !important; }
    </style>
</head>
<body>

<button id="shop-toggle" onclick="toggleShop()">🛒 МАГАЗИН ❯</button>
<button id="admin-toggle" onclick="openAdminModal()">👑 АДМИНКА</button>

<div id="main-wrapper">
    <div id="shop-panel">
        <h3 style="color: #ff9800; text-align: center;">НАЖИВКИ</h3>
        <div class="shop-item">
            <div style="color: #4caf50;">Хлеб (+20%)</div>
            <div style="font-size: 8px; margin: 10px 0;">50 ¥</div>
            <button onclick="buyBait('bread')" style="padding: 5px; font-size: 8px;">КУПИТЬ</button>
        </div>
        <div class="shop-item">
            <div style="color: #2196f3;">Червяк (+50%)</div>
            <div style="font-size: 8px; margin: 10px 0;">150 ¥</div>
            <button onclick="buyBait('worm')" style="padding: 5px; font-size: 8px;">КУПИТЬ</button>
        </div>
        <div class="shop-item">
            <div style="color: #9c27b0;">Опарыш (x2)</div>
            <div style="font-size: 8px; margin: 10px 0;">500 ¥</div>
            <button onclick="buyBait('premium')" style="padding: 5px; font-size: 8px;">КУПИТЬ</button>
        </div>
        <div id="active-bait-display" style="color: #ffd700; text-align: center; margin-top: 20px; font-size: 8px;">АКТИВНО: НЕТ</div>
    </div>

    <div id="game-container">
        <div class="panel" style="width: 200px; text-align: center;">
            <h3 style="color: #ff9800; margin: 0;">BUTT FISHING</h3><br>
            <div style="color: #fff;">ПОЙМАНО: <br><br><span id="total-score">0</span></div><br>
            <div style="color: #ffd700;">ЮАНИ: <br><br><span id="total-yuan">0</span> ¥</div>
            <hr style="border-color: #333; width: 100%;">
            <div style="font-size: 7px; color: #aaa; line-height: 1.5;">
                КУРС:<br>
                Обычные: 100г = 1¥<br>
                Трофей: 100г = 2¥
            </div>
        </div>

        <div class="panel center-panel">
            <div id="auth-section">
                <h3 style="color: #ff9800;">ВХОД В ИГРУ</h3>
                <input type="text" id="nick-input" placeholder="НИКНЕЙМ"><br>
                <input type="password" id="pass-input" placeholder="ПАРОЛЬ"><br>
                
                <label style="font-size: 8px; color: #aaa;">ВЫБЕРИ ПОЗЫВНОЙ:</label><br>
                <select id="callsign-input">
                    <option value="ОСТАП">ОСТАП (Удача +30%)</option>
                    <option value="СОКОЛ">СОКОЛ (Время +25%)</option>
                    <option value="ФАНТОМ">ФАНТОМ (Продажа +15%)</option>
                    <option value="ЩУКА">ЩУКА (Круг +15%)</option>
                </select><br><br>

                <button onclick="login()">ВОЙТИ / РЕГ</button>
                <div id="auth-error" style="color: #f44336; margin-top: 10px; font-size: 8px;"></div>
            </div>

            <div id="fishing-section" style="display: none;">
                <div id="callsign-display" style="color: #ffd700; font-size: 8px; margin-bottom: 8px;">ПОЗЫВНОЙ: -</div>
                
                <div id="fishing-area">
                    <div class="water"></div>
                    <div class="dock"></div>
                    <div id="player-character">
                        <div class="rod"></div>
                        <div class="body"></div>
                        <div class="head"></div>
                    </div>
                    <div id="fishing-float" class="float"></div>
                    <div id="minigame-area"></div>
                </div>

                <div id="status-text" style="margin-bottom: 10px; color: #fff;">ТИШИНА...</div>
                <button id="cast-btn" onclick="castLine()">ЗАБРОСИТЬ 🎣</button>
            </div>
        </div>

        <div class="panel" style="width: 250px;">
            <h3 style="margin: 0; text-align: center;">ИНВЕНТАРЬ</h3>
            <button id="sell-all-btn" style="width: 100%; font-size: 8px; margin-bottom: 10px;" onclick="sellAllFish()">ПРОДАТЬ ВСЁ 💰</button>
            <div id="inventory-list"></div>
        </div>
    </div>
</div>

<div id="admin-modal">
    <div class="admin-box">
        <h3 style="color: #d32f2f; text-align: center; margin-top: 0;">АДМИН-ПАНЕЛЬ</h3>
        <div id="admin-players-list"></div>
        <button onclick="closeAdminModal()" style="width: 100%; margin-top: 10px; background: #444;">ЗАКРЫТЬ</button>
    </div>
</div>

<script>
    let currentNick = localStorage.getItem('bf_nick') || '';
    let sessionToken = sessionStorage.getItem('bf_token') || '';
    let isAdmin = false;

    let mgClicksNeeded = 0, mgClicksDone = 0, mgTargetSize = 0, mgTimer = null;

    if (currentNick && sessionToken) {
        syncData();
    }

    function toggleShop() {
        const wrapper = document.getElementById('main-wrapper');
        wrapper.classList.toggle('shifted');
        document.getElementById('shop-toggle').innerText = wrapper.classList.contains('shifted') ? "❮ ЗАКРЫТЬ" : "🛒 МАГАЗИН ❯";
    }

    async function req(url, body) {
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nick: currentNick, token: sessionToken, ...body })
        });
        return res.json();
    }

    async function login() {
        currentNick = document.getElementById('nick-input').value.trim();
        const password = document.getElementById('pass-input').value.trim();
        const callsign = document.getElementById('callsign-input').value;
        const errDiv = document.getElementById('auth-error');

        if (!currentNick || !password) {
            errDiv.innerText = "Заполните ник и пароль!";
            return;
        }

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nick: currentNick, password, callsign })
        });
        const data = await res.json();

        if (!data.success) {
            errDiv.innerText = data.error;
            return;
        }

        sessionToken = data.token;
        localStorage.setItem('bf_nick', currentNick);
        sessionStorage.setItem('bf_token', sessionToken);

        isAdmin = data.isAdmin;
        if (isAdmin) document.getElementById('admin-toggle').style.display = 'block';

        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('fishing-section').style.display = 'block';
        updateUI(data);
    }

    function updateUI(data) {
        document.getElementById('total-yuan').innerText = parseFloat(data.yuan).toFixed(2);
        document.getElementById('total-score').innerText = data.score;
        document.getElementById('active-bait-display').innerText = data.activeBait ? `АКТИВНО: ${data.activeBait.toUpperCase()}` : "АКТИВНО: НЕТ";
        document.getElementById('callsign-display').innerText = `ПОЗЫВНОЙ: ${data.callsign} (${data.callsignBonus})`;
        renderInventory(data.inventory);
    }

    async function syncData() {
        const data = await req('/api/sync', {});
        if (data.yuan !== undefined) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('fishing-section').style.display = 'block';
            if (data.isAdmin) document.getElementById('admin-toggle').style.display = 'block';
            updateUI(data);
        }
    }

    async function buyBait(baitId) {
        const data = await req('/api/buy', { baitId });
        if (data.success) syncData();
        else alert(data.error || "Не хватает юаней!");
    }

    async function castLine() {
        const btn = document.getElementById('cast-btn');
        const floatObj = document.getElementById('fishing-float');
        btn.disabled = true;
        floatObj.style.display = 'block';
        document.getElementById('status-text').innerText = "Ждем поклевку...";

        setTimeout(async () => {
            const hookData = await req('/api/cast', {});
            startMinigame(hookData);
        }, 2000 + Math.random() * 3000);
    }

    function startMinigame(data) {
        const area = document.getElementById('minigame-area');
        document.getElementById('status-text').innerText = "КЛЮЁТ! ЛОВИ КРУГИ!";
        area.style.display = 'block';

        mgClicksNeeded = data.clicks;
        mgClicksDone = 0;
        mgTargetSize = data.size;

        mgTimer = setTimeout(failMinigame, data.timeLimit);
        spawnCircle();
    }

    function spawnCircle() {
        const area = document.getElementById('minigame-area');
        area.innerHTML = '';
        const circle = document.createElement('div');
        circle.className = 'target-circle';
        circle.style.width = mgTargetSize + 'px';
        circle.style.height = mgTargetSize + 'px';

        const maxX = area.clientWidth - mgTargetSize;
        const maxY = area.clientHeight - mgTargetSize;
        circle.style.left = Math.floor(Math.random() * maxX) + 'px';
        circle.style.top = Math.floor(Math.random() * maxY) + 'px';

        circle.onclick = (e) => {
            e.stopPropagation();
            mgClicksDone++;
            if (mgClicksDone >= mgClicksNeeded) finishMinigame();
            else spawnCircle();
        };
        area.appendChild(circle);
    }

    function failMinigame() {
        clearTimeout(mgTimer);
        document.getElementById('minigame-area').style.display = 'none';
        document.getElementById('fishing-float').style.display = 'none';
        document.getElementById('status-text').innerText = "Сорвалось...";
        document.getElementById('cast-btn').disabled = false;
    }

    async function finishMinigame() {
        clearTimeout(mgTimer);
        document.getElementById('minigame-area').style.display = 'none';
        document.getElementById('fishing-float').style.display = 'none';

        const data = await req('/api/catch', {});
        if (data.success) {
            document.getElementById('status-text').innerHTML = `ПОЙМАН: ${data.fish.displayName}`;
            syncData();
        } else {
            document.getElementById('status-text').innerText = data.reason;
        }
        document.getElementById('cast-btn').disabled = false;
    }

    async function sellAllFish() {
        await req('/api/sellAll', {});
        syncData();
    }

    function renderInventory(inv) {
        const list = document.getElementById('inventory-list');
        list.innerHTML = inv.length === 0 ? "<div style='text-align:center; color:#666;'>Пусто</div>" : "";
        inv.forEach(fish => {
            const div = document.createElement('div');
            div.className = 'fish-card';
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; font-size:8px;">
                    <span style="color:${fish.isTrophy ? '#ffd700' : '#fff'}">${fish.displayName}</span>
                    <span>${fish.weight >= 1000 ? (fish.weight/1000).toFixed(2)+' кг' : fish.weight+' г'}</span>
                </div>
                <div style="color:#ffd700; font-size:8px; margin-top:5px;">${fish.price} ¥</div>
            `;
            list.appendChild(div);
        });
    }

    async function openAdminModal() {
        document.getElementById('admin-modal').style.display = 'flex';
        const data = await req('/api/admin/getPlayers', {});
        const container = document.getElementById('admin-players-list');
        container.innerHTML = '';

        if (!data.success) return;

        data.players.forEach(p => {
            const row = document.createElement('div');
            row.className = 'admin-row';
            row.innerHTML = `
                <div>
                    <strong>${p.nick}</strong> [${p.callsign}] ${p.isAdmin ? '👑' : ''}<br>
                    Рыб: ${p.inventoryCount}
                </div>
                <div>
                    Юани: <input type="number" id="adm-yuan-${p.nick}" class="admin-input" value="${p.yuan}">
                    Бычки: <input type="number" id="adm-score-${p.nick}" class="admin-input" value="${p.score}">
                </div>
                <div>
                    <button onclick="savePlayerData('${p.nick}')" style="padding:4px; font-size:7px;">СОХРАНИТЬ</button>
                    <button onclick="deletePlayer('${p.nick}')" style="padding:4px; font-size:7px; background:#d32f2f;">Х</button>
                </div>
            `;
            container.appendChild(row);
        });
    }

    async function savePlayerData(targetNick) {
        const newYuan = document.getElementById(`adm-yuan-${targetNick}`).value;
        const newScore = document.getElementById(`adm-score-${targetNick}`).value;
        await req('/api/admin/updatePlayer', { targetNick, newYuan, newScore });
        openAdminModal();
        if (targetNick === currentNick) syncData();
    }

    async function deletePlayer(targetNick) {
        if (!confirm(`Удалить аккаунт ${targetNick}?`)) return;
        const data = await req('/api/admin/updatePlayer', { targetNick, deleteAccount: true });
        if (!data.success) alert(data.error);
        openAdminModal();
    }

    function closeAdminModal() {
        document.getElementById('admin-modal').style.display = 'none';
    }
</script>

</body>
</html>
