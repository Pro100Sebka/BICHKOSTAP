<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>BUTT FISHING</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { background-color: #1a1a1a; color: #d3d3d3; font-family: 'Press Start 2P', cursive; margin: 0; overflow: hidden; font-size: 10px; }
        
        #main-wrapper { display: flex; width: 100vw; height: 100vh; transition: transform 0.3s ease; transform: translateX(0); }
        .shifted { transform: translateX(220px) !important; } /* Сдвиг для открытия магазина */

        /* Левая панель (Магазин) */
        #shop-panel { width: 220px; background: #111; border-right: 4px solid #333; padding: 20px; box-sizing: border-box; position: absolute; left: -220px; height: 100vh; }
        .shop-item { background: #222; border: 2px solid #444; padding: 10px; margin-bottom: 10px; text-align: center; border-radius: 5px; }
        
        /* Кнопка переключения магазина */
        #shop-toggle { position: absolute; left: 10px; top: 10px; z-index: 100; background: #ff9800; border: none; padding: 10px; cursor: pointer; font-family: inherit; font-weight: bold; border-radius: 5px; }

        /* Игровое поле */
        #game-container { display: flex; justify-content: center; align-items: center; width: 100vw; gap: 20px; }
        .panel { background: #111; border: 2px solid #444; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .center-panel { width: 450px; text-align: center; }

        button { color: white; border: 2px solid #1a3a16; padding: 10px; cursor: pointer; font-family: 'Press Start 2P', cursive; font-size: 10px; border-radius: 5px; background: #2d5a27; }
        button:disabled { background: #555 !important; border-color: #333 !important; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #3e7a36; }
        
        input { background: #000; border: 1px solid #555; color: #fff; padding: 8px; font-family: inherit; font-size: 10px; text-align: center; margin-bottom: 10px; width: 80%;}

        #fishing-area { position: relative; background: linear-gradient(#1c2a38, #0f161c); border: 2px solid #444; height: 250px; margin-bottom: 15px; overflow: hidden; }
        .water { position: absolute; bottom: 0; width: 100%; height: 50%; background: #0c1a24; border-top: 2px solid #234d65; }
        
        /* Мини-игра (кликер кругов) */
        #minigame-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; background: rgba(0,0,0,0.7); z-index: 10; }
        .target-circle { position: absolute; background: #4caf50; border: 2px solid #fff; border-radius: 50%; cursor: pointer; }
        
        .rarity-common { color: #aaaaaa; } .rarity-uncommon { color: #4caf50; } .rarity-rare { color: #2196f3; } .rarity-epic { color: #9c27b0; } .rarity-legendary { color: #ffeb3b; }
        
        .fish-card { background: #181818; border: 1px solid #333; padding: 8px; margin-bottom: 5px; }
        #inventory-list { max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>

<button id="shop-toggle" onclick="toggleShop()">🛒 МАГАЗИН ❯</button>

<div id="main-wrapper">
    <!-- Левая панель (Магазин наживок) -->
    <div id="shop-panel">
        <h3 style="color: #ff9800; text-align: center;">НАЖИВКИ</h3>
        <p style="font-size: 8px; color: #aaa; text-align: center;">Увеличивают размер круга при подсечке.</p>
        
        <div class="shop-item">
            <div style="color: #4caf50;">Хлеб (+20%)</div>
            <div style="font-size: 8px; margin: 10px 0;">50 ¥</div>
            <button onclick="buyBait('bread')" style="padding: 5px; font-size: 8px;">КУПИТЬ</button>
        </div>
        <div class="shop-item">
            <div style="color: #2196f3;">Червяк (+50%)</div>
            <div style="font-size: 8px; margin: 10px 0;">150 ¥</div>
            <button onclick="buyBait('worm')" style="padding: 5px; font-size: 8px;">КУПИТЬ</button>
        </div>
        <div class="shop-item">
            <div style="color: #9c27b0;">Опарыш (x2)</div>
            <div style="font-size: 8px; margin: 10px 0;">500 ¥</div>
            <button onclick="buyBait('premium')" style="padding: 5px; font-size: 8px;">КУПИТЬ</button>
        </div>
        <div id="active-bait-display" style="color: #ffd700; text-align: center; margin-top: 20px; font-size: 9px;">АКТИВНО: НЕТ</div>
    </div>

    <!-- Основная игра -->
    <div id="game-container">
        <!-- Статистика -->
        <div class="panel" style="width: 200px; text-align: center;">
            <h3 style="color: #ff9800; margin: 0;">BUTT FISHING</h3><br>
            <div style="color: #fff;">БЫЧКИ: <br><br><span id="total-score">0</span></div><br>
            <div style="color: #ffd700;">ЮАНИ: <br><br><span id="total-yuan">0</span> ¥</div>
        </div>

        <!-- Центральный экран -->
        <div class="panel center-panel">
            <div id="auth-section">
                <input type="text" id="nick-input" placeholder="НИКНЕЙМ">
                <button onclick="login()">ВОЙТИ</button>
            </div>

            <div id="fishing-section" style="display: none;">
                <div id="fishing-area">
                    <div class="water"></div>
                    <!-- Зона мини-игры -->
                    <div id="minigame-area"></div>
                </div>

                <div id="status-text" style="margin-bottom: 10px; color: #fff;">ТИШИНА...</div>
                <button id="cast-btn" onclick="castLine()">ЗАБРОСИТЬ 🎣</button>
            </div>
        </div>

        <!-- Инвентарь -->
        <div class="panel" style="width: 250px;">
            <h3 style="margin: 0; text-align: center;">ИНВЕНТАРЬ</h3>
            <button id="sell-all-btn" style="width: 100%; font-size: 8px; margin-bottom: 10px;" onclick="sellAllFish()">ПРОДАТЬ ВСЁ 💰</button>
            <div id="inventory-list"></div>
        </div>
    </div>
</div>

<script>
    let currentNick = localStorage.getItem('buttFishingNick') || null;
    
    // Переменные мини-игры
    let mgClicksNeeded = 0;
    let mgClicksDone = 0;
    let mgTargetSize = 0;
    let mgTimer = null;

    if (currentNick) {
        document.getElementById('nick-input').value = currentNick;
        login();
    }

    function toggleShop() {
        const wrapper = document.getElementById('main-wrapper');
        const btn = document.getElementById('shop-toggle');
        wrapper.classList.toggle('shifted');
        btn.innerText = wrapper.classList.contains('shifted') ? "❮ ЗАКРЫТЬ" : "🛒 МАГАЗИН ❯";
    }

    async function login() {
        const nick = document.getElementById('nick-input').value.trim();
        if (!nick) return;
        currentNick = nick;
        localStorage.setItem('buttFishingNick', nick);
        
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('fishing-section').style.display = 'block';
        await syncData();
    }

    async function req(url, body) {
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nick: currentNick, ...body })
        });
        return res.json();
    }

    async function syncData() {
        const data = await req('/api/sync', {});
        document.getElementById('total-yuan').innerText = parseFloat(data.yuan).toFixed(1);
        document.getElementById('total-score').innerText = data.score;
        document.getElementById('active-bait-display').innerText = data.activeBait ? `АКТИВНО: ${data.activeBait.toUpperCase()}` : "АКТИВНО: НЕТ";
        renderInventory(data.inventory);
    }

    async function buyBait(baitId) {
        const data = await req('/api/buy', { baitId });
        if (data.success) {
            syncData();
        } else {
            alert("Не хватает юаней!");
        }
    }

    async function castLine() {
        const btn = document.getElementById('cast-btn');
        const status = document.getElementById('status-text');
        
        btn.disabled = true;
        status.innerText = "Ждем поклевку...";
        status.style.color = "#aaa";

        setTimeout(async () => {
            const hookData = await req('/api/cast', {});
            startMinigame(hookData);
        }, 2000 + Math.random() * 4000);
    }

    function startMinigame(data) {
        const status = document.getElementById('status-text');
        const area = document.getElementById('minigame-area');
        
        status.innerText = "КЛЮЁТ! ЛОВИ КРУГИ!";
        status.style.color = "#ffeb3b";
        area.style.display = 'block';

        mgClicksNeeded = data.clicks;
        mgClicksDone = 0;
        mgTargetSize = data.size;

        // Таймер провала
        mgTimer = setTimeout(() => {
            failMinigame();
        }, data.timeLimit);

        spawnCircle();
    }

    function spawnCircle() {
        const area = document.getElementById('minigame-area');
        area.innerHTML = ''; // Очищаем старый круг

        const circle = document.createElement('div');
        circle.className = 'target-circle';
        circle.style.width = mgTargetSize + 'px';
        circle.style.height = mgTargetSize + 'px';
        
        // Случайная позиция внутри контейнера
        const maxX = area.clientWidth - mgTargetSize;
        const maxY = area.clientHeight - mgTargetSize;
        circle.style.left = Math.floor(Math.random() * maxX) + 'px';
        circle.style.top = Math.floor(Math.random() * maxY) + 'px';

        // Нажатие по кругу
        circle.onclick = (e) => {
            e.stopPropagation();
            mgClicksDone++;
            if (mgClicksDone >= mgClicksNeeded) {
                finishMinigame();
            } else {
                spawnCircle(); // Спавним следующий
            }
        };

        area.appendChild(circle);
    }

    function failMinigame() {
        clearTimeout(mgTimer);
        document.getElementById('minigame-area').style.display = 'none';
        document.getElementById('minigame-area').innerHTML = '';
        
        const status = document.getElementById('status-text');
        status.innerText = "Сорвалось...";
        status.style.color = "#f44336";
        document.getElementById('cast-btn').disabled = false;
    }

    async function finishMinigame() {
        clearTimeout(mgTimer);
        document.getElementById('minigame-area').style.display = 'none';
        document.getElementById('minigame-area').innerHTML = '';

        const data = await req('/api/catch', {});
        const status = document.getElementById('status-text');
        
        if (data.success) {
            status.innerHTML = `<span class="${data.fish.class}">ПОЙМАН: ${data.fish.displayName}</span>`;
            syncData(); // Обновляем данные с сервера
        } else {
            status.innerText = data.reason;
            status.style.color = "#f44336";
        }
        document.getElementById('cast-btn').disabled = false;
    }

    async function sellAllFish() {
        await req('/api/sellAll', {});
        syncData();
    }

    function renderInventory(inv) {
        const list = document.getElementById('inventory-list');
        list.innerHTML = "";
        
        if (inv.length === 0) {
            list.innerHTML = "<div style='text-align:center; color:#666;'>Пусто</div>";
            return;
        }

        inv.forEach(fish => {
            const div = document.createElement('div');
            div.className = 'fish-card';
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; font-size:8px;">
                    <span class="${fish.class}">${fish.displayName}</span>
                    <span style="color:white;">${fish.weight >= 1000 ? (fish.weight/1000).toFixed(2)+' кг' : fish.weight+' г'}</span>
                </div>
                <div style="color:#ffd700; font-size:8px; margin-top:5px;">${fish.price} ¥</div>
            `;
            list.appendChild(div);
        });
    }
</script>

</body>
</html>
